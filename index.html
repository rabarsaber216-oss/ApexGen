<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexGen - Auto AI 3D Cloud Studio</title>
    <!-- Three.js, Controls & GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            color: #ffffff;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* Top Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            background: linear-gradient(to bottom, rgba(5, 8, 17, 0.95), transparent);
            pointer-events: none;
        }
        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            pointer-events: auto;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }
        .btn {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .btn-primary {
            background: #0284c7;
            border-color: #38bdf8;
        }
        .btn-code {
            border-color: #a855f7;
            color: #d8b4fe;
        }
        .hidden {
            display: none !important;
        }

        /* Live Code Viewer */
        #code-viewer-panel {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 90%;
            max-width: 380px;
            height: 280px;
            background: rgba(9, 14, 28, 0.96);
            border: 1px solid #8b5cf6;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(14px);
            z-index: 25;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid #334155;
            font-size: 0.78rem;
            font-weight: 700;
            color: #c7d2fe;
        }
        .viewer-controls {
            display: flex;
            gap: 6px;
        }
        .viewer-btn {
            background: #334155;
            border: none;
            color: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        #code-content {
            padding: 10px;
            margin: 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            background: #030712;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }

        /* Bottom AI Chat Bar */
        .chat-container {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 650px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-status {
            font-size: 0.78rem;
            color: #94a3b8;
            background: rgba(10, 15, 29, 0.92);
            padding: 6px 14px;
            border-radius: 6px;
            align-self: flex-start;
            backdrop-filter: blur(8px);
            max-width: 100%;
            word-break: break-word;
            border-left: 3px solid #38bdf8;
        }
        .chat-bar {
            display: flex;
            background: rgba(10, 15, 29, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 6px 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.92rem;
            padding: 8px 12px;
        }
        .chat-input::placeholder {
            color: #64748b;
        }
        .btn-send {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: #0b1120;
            border: 1px solid #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }
        .modal-title {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .modal-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">ApexGen</div>
        <div class="header-actions">
            <button id="toggle-code-btn" class="btn btn-code">Code &lt;/&gt;</button>
            <button id="key-btn" class="btn">Key ⚙️</button>
            <button id="clear-btn" class="btn">Clear</button>
        </div>
    </header>

    <div id="webgl-canvas"></div>

    <!-- Live Code Viewer -->
    <div id="code-viewer-panel">
        <div class="viewer-header">
            <span>⚡ Live Three.js & Cloud GLB</span>
            <div class="viewer-controls">
                <button id="copy-code-btn" class="viewer-btn">Copy</button>
                <button id="close-viewer-btn" class="viewer-btn">✕</button>
            </div>
        </div>
        <pre id="code-content">// 3D Cloud Auto-Fetcher Ready...</pre>
    </div>

    <!-- AI Chat Box -->
    <div class="chat-container">
        <div id="status-indicator" class="chat-status">ApexGen Cloud AI Ready. Type any 3D asset idea!</div>
        <div class="chat-bar">
            <input type="text" id="ai-input" class="chat-input" placeholder="Try: robot, car, soldier, fox, horse, helmet..." />
            <button id="ai-send" class="btn-send">Generate</button>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 class="modal-title">Gemini API Key</h2>
            <p class="modal-desc">Paste your Gemini API key to activate Auto-3D fetching.</p>
            <div class="input-group">
                <label>API Key</label>
                <input type="text" id="api-key-input" placeholder="Paste your API key here..." />
            </div>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-save-key" class="btn btn-primary">Save Key</button>
                <button id="btn-close-key" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let activeMixers = [];
        let currentModels = [];
        let clock = new THREE.Clock();
        const gltfLoader = new THREE.GLTFLoader();

        const CLOUD_ASSETS = {
            "robot": "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
            "car": "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/ToyCar/glTF-Binary/ToyCar.glb",
            "soldier": "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb",
            "helmet": "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF-Binary/DamagedHelmet.glb",
            "fox": "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb",
            "horse": "https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Horse.glb",
            "buggy": "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Buggy/glTF-Binary/Buggy.glb"
        };

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);
            scene.fog = new THREE.FogExp2(0x060913, 0.025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 9);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            setupLighting();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111827, 0.9);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            rimLight.position.set(-10, 8, -10);
            scene.add(rimLight);

            const groundGeo = new THREE.CylinderGeometry(14, 14, 0.3, 64);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.4 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.15;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(26, 26, 0x38bdf8, 0x1e293b);
            grid.position.y = 0.01;
            scene.add(grid);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            for (let mixer of activeMixers) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        window.loadCloudGLB = function(url, scale = 1, pos = {x:0, y:0, z:0}) {
            const status = document.getElementById('status-indicator');
            status.innerText = "⚡ Loading 3D model directly from cloud...";

            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                model.scale.set(scale, scale, scale);
                model.position.set(pos.x, pos.y, pos.z);

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);
                currentModels.push(model);

                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                    activeMixers.push(mixer);
                }

                status.innerText = "✨ HD Model Loaded & Animated Successfully!";
            }, undefined, (err) => {
                status.innerText = "Failed loading GLB: " + err.message;
            });
        };

        async function handleExecution(promptText) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            const lower = promptText.toLowerCase().trim();

            // Direct Fast Match: Works instantly without needing API!
            for (let key in CLOUD_ASSETS) {
                if (lower.includes(key)) {
                    codeContent.innerText = `// Direct Cloud GLB Match: ${key}\nwindow.loadCloudGLB("${CLOUD_ASSETS[key]}", 1.5, {x:0, y:0, z:0});`;
                    document.getElementById('code-viewer-panel').classList.remove('hidden');
                    window.loadCloudGLB(CLOUD_ASSETS[key], (key === 'car' ? 25 : key === 'fox' ? 0.04 : 1.5), {x:0, y:0, z:0});
                    return;
                }
            }

            // Fallback to Gemini AI if it's a custom prompt
            const apiKey = localStorage.getItem('apexgen_api_key');
            if (!apiKey) {
                document.getElementById('api-modal').classList.remove('hidden');
                return;
            }

            status.innerText = "Connecting to Gemini AI...";
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "You are a Three.js expert. Output only valid JS code inside ```javascript ... ``` to construct the user request in scene." },
                                { text: `User request: ${promptText}` }
                            ]
                        }]
                    })
                });

                if (!res.ok) throw new Error("API call failed. Check key or try keyword like 'robot' or 'car'.");

                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const match = text.match(/```(?:javascript|js)?([\s\S]*?)```/);
                const codeToRun = match ? match[1].trim() : text;

                codeContent.innerText = codeToRun;
                document.getElementById('code-viewer-panel').classList.remove('hidden');
                new Function('scene', 'THREE', codeToRun)(scene, THREE);
                status.innerText = "✨ Done!";
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScene();

            document.getElementById('key-btn').addEventListener('click', () => {
                document.getElementById('api-key-input').value = localStorage.getItem('apexgen_api_key') || '';
                document.getElementById('api-modal').classList.remove('hidden');
            });

            document.getElementById('btn-close-key').addEventListener('click', () => {
                document.getElementById('api-modal').classList.add('hidden');
            });

            document.getElementById('btn-save-key').addEventListener('click', () => {
                const key = document.getElementById('api-key-input').value.trim();
                if (key) {
                    localStorage.setItem('apexgen_api_key', key);
                    document.getElementById('api-modal').classList.add('hidden');
                    document.getElementById('status-indicator').innerText = "API Key saved!";
                }
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                currentModels.forEach(m => scene.remove(m));
                currentModels = [];
                activeMixers = [];
                document.getElementById('status-indicator').innerText = "Canvas cleared.";
            });

            document.getElementById('toggle-code-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.toggle('hidden');
            });
            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.add('hidden');
            });
            document.getElementById('copy-code-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('code-content').innerText).then(() => alert("Code copied!"));
            });

            const aiInput = document.getElementById('ai-input');
            const aiSend = document.getElementById('ai-send');
            const handleSend = () => {
                const prompt = aiInput.value.trim();
                if (prompt) {
                    handleExecution(prompt);
                    aiInput.value = '';
                }
            };
            aiSend.addEventListener('click', handleSend);
            aiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
        });
    </script>
</body>
</html>
