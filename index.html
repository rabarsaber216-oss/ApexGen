<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexGen - AAA 3D Interactive Engine</title>
    <!-- Three.js, Controls & JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030611;
            color: #ffffff;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* 1. CINEMATIC PS5 INTRO */
        #boot-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #02040a;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #intro-stars-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001;
            pointer-events: none;
        }
        .intro-content {
            position: relative;
            z-index: 1002;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .intro-welcome {
            font-size: 0.95rem;
            letter-spacing: 2.5px;
            color: #94a3b8;
            text-transform: uppercase;
            animation: fadeInWelcome 3.5s forwards ease-in-out;
            opacity: 0;
        }
        .intro-brand-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #38bdf8;
            text-shadow: 0 0 35px rgba(56, 189, 248, 0.8), 0 0 70px rgba(56, 189, 248, 0.4);
            opacity: 0;
            animation: revealBrand 4.5s 2.5s forwards ease-out;
        }
        .intro-enter-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(14, 165, 233, 0.15));
            color: #f8fafc;
            border: 1px solid #38bdf8;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            opacity: 0;
            animation: fadeInBtn 1.5s 5.5s forwards ease;
        }
        @keyframes fadeInWelcome { 0% { opacity: 0; } 50% { opacity: 0.9; } 100% { opacity: 0.9; } }
        @keyframes revealBrand { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes fadeInBtn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }

        /* Top Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(5, 8, 17, 0.95), transparent);
            pointer-events: none;
        }
        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            pointer-events: auto;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            pointer-events: auto;
            align-items: center;
        }
        .btn {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .btn-danger {
            background: rgba(225, 29, 72, 0.85);
            border-color: #fb7185;
            color: white;
        }
        .btn-primary { background: #0284c7; border-color: #38bdf8; }
        .hidden { display: none !important; }

        /* 2. ANALOG JOYSTICK (Refined Touch Engine) */
        #joystick-zone {
            position: absolute;
            bottom: 85px;
            left: 20px;
            width: 130px;
            height: 130px;
            z-index: 50;
            touch-action: none;
        }
        .joystick-base {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #384152 0%, #1e2430 65%, #0f131a 100%);
            border: 4px solid #475569;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.85), inset 0 2px 6px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .joystick-thumb {
            position: absolute;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #64748b 0%, #334155 70%, #1e293b 100%);
            border: 2px solid #94a3b8;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9), inset 0 2px 5px rgba(255,255,255,0.4);
            pointer-events: none;
        }
        .joystick-thumb::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 50%;
        }

        /* 3. ACTION BUTTONS (Jump, Attack, Sprint) */
        #action-buttons-zone {
            position: absolute;
            bottom: 90px;
            right: 20px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .action-row {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            color: white;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7), 0 0 12px rgba(56, 189, 248, 0.3);
            cursor: pointer;
            backdrop-filter: blur(8px);
            touch-action: none;
        }
        .action-btn:active {
            transform: scale(0.9);
            background: rgba(2, 132, 199, 0.9);
            box-shadow: 0 0 20px #38bdf8;
        }
        .action-btn-attack {
            border-color: #f43f5e;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }
        .action-btn-sprint {
            border-color: #eab308;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }

        /* 4. MODEL SELECTION PICKER MODAL (Full Smooth Scrolling) */
        #picker-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .picker-card {
            background: #0b1120;
            border: 1px solid #1e293b;
            border-radius: 16px;
            width: 94%;
            max-width: 450px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        }
        .picker-header {
            padding: 14px 18px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .picker-title {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .picker-grid {
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            max-height: calc(85vh - 65px);
            padding-bottom: 35px;
        }
        .model-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .model-item:active {
            transform: scale(0.97);
            border-color: #38bdf8;
        }
        .model-thumb {
            width: 100%;
            height: 105px;
            object-fit: cover;
            background: #0f172a;
        }
        .model-info {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .model-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model-author {
            font-size: 0.68rem;
            color: #94a3b8;
        }

        /* Bottom Search & AI Bar */
        .chat-container {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 650px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-status {
            font-size: 0.76rem;
            color: #94a3b8;
            background: rgba(10, 15, 29, 0.92);
            padding: 5px 12px;
            border-radius: 6px;
            align-self: flex-start;
            backdrop-filter: blur(8px);
            border-left: 3px solid #38bdf8;
            max-width: 100%;
        }
        .chat-bar {
            display: flex;
            background: rgba(10, 15, 29, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 5px 8px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
            align-items: center;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.88rem;
            padding: 6px 8px;
        }
        .btn-img-upload {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-card {
            background: #0b1120;
            border: 1px solid #1e293b;
            padding: 22px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-card input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. INTRO SCREEN -->
    <div id="boot-intro">
        <canvas id="intro-stars-canvas"></canvas>
        <div class="intro-content">
            <div class="intro-welcome">welcome to ApexGen</div>
            <div class="intro-brand-title">ApexGen</div>
            <button id="intro-enter-btn" class="intro-enter-btn">ENTER STUDIO</button>
        </div>
    </div>

    <header>
        <div class="brand">ApexGen</div>
        <div class="header-actions">
            <!-- Chase Cam Exit Button -->
            <button id="exit-control-btn" class="btn btn-danger hidden">Exit Control ✕</button>

    <div id="webgl-canvas"></div>

    <!-- 2. ANALOG JOYSTICK -->

        <div class="joystick-base" id="joystick-base">

    <!-- 3. ACTION BUTTONS (ATTACK, JUMP, SPRINT) -->
    <div id="action-buttons-zone" class="hidden">
        <div class="action-row">

        </div>
        <div class="action-row">

        </div>
    </div>

    <!-- 4. MODEL SELECTION PICKER MODAL -->
    <div id="picker-modal" class="hidden">
        <div class="picker-card">
            <div class="picker-header">
                <span class="picker-title">Select Style to Download</span>
                <button id="picker-close-btn" class="btn" style="padding: 2px 6px;">✕</button>
            </div>
            <div id="picker-grid" class="picker-grid"></div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="chat-container">
        <div id="status-indicator" class="chat-status">Ready. Type your idea to build!</div>
        <div class="chat-bar">
            <input type="file" id="image-file-input" accept="image/*" style="display:none;" />

    </div>

    <!-- Settings Modal -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="color:#38bdf8; margin-bottom: 10px;">API Keys</h3>
            <div style="text-align: left; font-size: 0.8rem; color: #94a3b8;">
                <label>Sketchfab Token (from sketchfab.com/settings/password)</label>
                <input type="text" id="sketchfab-token-input" placeholder="Paste Token..." />
                <label>Gemini API Key</label>
                <input type="text" id="gemini-key-input" placeholder="Paste Gemini Key..." />
            </div>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button id="btn-save-key" class="btn btn-primary">Save</button>
                <button id="btn-close-key" class="btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        // WEB AUDIO PROCEDURAL SOUND ENGINE
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.engineGain = null;
                this.engineOsc = null;
                this.isEngineRunning = false;
                this.lastStepTime = 0;
            }
            init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            startEngine() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                if (this.isEngineRunning) return;

                this.engineOsc = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.filter = this.ctx.createBiquadFilter();

                this.engineOsc.type = 'sawtooth';
                this.engineOsc.frequency.setValueAtTime(45, this.ctx.currentTime);

                this.filter.type = 'lowpass';
                this.filter.frequency.setValueAtTime(260, this.ctx.currentTime);

                this.engineGain.gain.setValueAtTime(0.09, this.ctx.currentTime);

                this.engineOsc.connect(this.filter);
                this.filter.connect(this.engineGain);
                this.engineGain.connect(this.ctx.destination);

                this.engineOsc.start();
                this.isEngineRunning = true;
            }
            setEngineSpeed(speedRatio) {
                if (!this.isEngineRunning || !this.engineOsc) return;
                const freq = 45 + Math.abs(speedRatio) * 115;
                this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);
                this.filter.frequency.setTargetAtTime(240 + Math.abs(speedRatio) * 450, this.ctx.currentTime, 0.05);
            }
            stopEngine() {
                if (!this.isEngineRunning) return;
                try {
                    this.engineGain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                    setTimeout(() => {
                        if (this.engineOsc) this.engineOsc.stop();
                        this.isEngineRunning = false;
                    }, 300);
                } catch(e) { this.isEngineRunning = false; }
            }
            playFootstep() {
                this.init();
                const now = performance.now();
                if (now - this.lastStepTime < 320) return;
                this.lastStepTime = now;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.09);
            }
            playAttack() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
            playJump() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.23);
            }
        }

        const audio = new SoundEngine();

        let scene, camera, renderer, controls;
        let activeMixers = [];
        let loadedModels = [];
        let staticColliders = []; // Solid collision barriers to prevent walking through walls
        let controlledEntity = null;
        let clock = new THREE.Clock();
        let infiniteFloor, infiniteGrid;

        // Controller input state
        const joystick = { x: 0, y: 0, active: false };
        const actionState = { sprint: false, jump: false, attack: false };

        // 1. BOOT INTRO WITH PARTICLES
        function initBootIntro() {
            const canvas = document.getElementById('intro-stars-canvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2 + 0.6,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: -Math.random() * 0.6 - 0.2,
                    alpha: Math.random() * 0.7 + 0.3
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.y < 0) p.y = h;
                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(186, 230, 253, ${p.alpha})`;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#38bdf8';
                    ctx.fill();
                });
                if (document.getElementById('boot-intro').style.display !== 'none') {
                    requestAnimationFrame(draw);
                }
            }
            draw();

            const closeIntro = () => {
                audio.init();
                const introEl = document.getElementById('boot-intro');
                introEl.style.opacity = '0';
                setTimeout(() => { introEl.style.display = 'none'; }, 1000);
            };

            document.getElementById('intro-enter-btn').addEventListener('click', closeIntro);
            setTimeout(() => {
                if (document.getElementById('boot-intro').style.display !== 'none') closeIntro();
            }, 9200);
        }

        // 2. THREE.JS ENGINE SETUP
        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);
            scene.fog = new THREE.FogExp2(0x060913, 0.0035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 8, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 1000;
            controls.maxPolarAngle = Math.PI / 2 + 0.01;

            setupInfiniteMap();
            setupLighting();
            setupAnalogJoystick();
            setupActionButtons();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function setupInfiniteMap() {
            const groundGeo = new THREE.PlaneGeometry(12000, 12000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x080d1a, roughness: 0.8, metalness: 0.2 });
            infiniteFloor = new THREE.Mesh(groundGeo, groundMat);
            infiniteFloor.rotation.x = -Math.PI / 2;
            infiniteFloor.receiveShadow = true;
            scene.add(infiniteFloor);

            infiniteGrid = new THREE.GridHelper(3000, 300, 0x38bdf8, 0x1e293b);
            infiniteGrid.position.y = 0.02;
            scene.add(infiniteGrid);
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111827, 0.9);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfff5ea, 2.0);
            sunLight.position.set(30, 50, 25);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            rimLight.position.set(-20, 15, -20);
            scene.add(rimLight);
        }

        // 3. GLITCH-FREE MULTI-TOUCH JOYSTICK
        function setupAnalogJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const maxRadius = 38;
            let touchId = null;
            let center = { x: 0, y: 0 };

            const updatePos = (clientX, clientY) => {
                let dx = clientX - center.x;
                let dy = clientY - center.y;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystick.x = dx / maxRadius;
                joystick.y = -dy / maxRadius; // Up is positive
            };

            const reset = () => {
                touchId = null;
                joystick.active = false;
                joystick.x = 0;
                joystick.y = 0;
                thumb.style.transform = `translate(0px, 0px)`;
            };

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                const rect = base.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                joystick.active = true;
                updatePos(t.clientX, t.clientY);
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        updatePos(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                if (!joystick.active) return;
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        reset();
                        break;
                    }
                }
            };
            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);
        }

        // 4. ACTION BUTTONS SETUP
        function setupActionButtons() {
            const jumpBtn = document.getElementById('btn-jump');
            const sprintBtn = document.getElementById('btn-sprint');
            const attackBtn = document.getElementById('btn-attack');

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (controlledEntity && controlledEntity.isGrounded) {
                    controlledEntity.velocity.y = 11.5;
                    controlledEntity.isGrounded = false;
                    audio.playJump();
                }
            });

            sprintBtn.addEventListener('touchstart', (e) => { e.preventDefault(); actionState.sprint = true; });
            sprintBtn.addEventListener('touchend', (e) => { e.preventDefault(); actionState.sprint = false; });

            attackBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                audio.playAttack();
                if (controlledEntity && controlledEntity.actions && controlledEntity.actions.attack) {
                    controlledEntity.actions.attack.reset().play();
                } else if (controlledEntity && controlledEntity.model) {
                    // Quick physical thrust animation if model has no attack clip
                    const initialZ = controlledEntity.model.rotation.z;
                    controlledEntity.model.rotation.z += 0.35;
                    setTimeout(() => { controlledEntity.model.rotation.z = initialZ; }, 180);
                }
            });
        }

        // 5. COLLISION CHECK (Prevent walking through walls/buildings)
        function checkCollision(nextPos, radius = 0.8) {
            for (let obs of staticColliders) {
                const dist = Math.hypot(nextPos.x - obs.position.x, nextPos.z - obs.position.z);
                if (dist < (obs.radius + radius)) {
                    return true; // Solid obstacle detected!
                }
            }
            return false;
        }

        // 6. MAIN PHYSICS & CHASE CAM UPDATE LOOP
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (controlledEntity && controlledEntity.model) {
                const { model, type, wheels, actions, velocity } = controlledEntity;

                if (type === 'vehicle') {
                    // REALISTIC VEHICLE DRIVING PHYSICS
                    const turnInput = -joystick.x;
                    const driveInput = joystick.y;
                    const speedRatio = driveInput;

                    audio.setEngineSpeed(speedRatio);

                    if (Math.abs(driveInput) > 0.05) {
                        model.rotation.y += turnInput * 2.8 * delta * (driveInput >= 0 ? 1 : -1);
                    }

                    const forwardVector = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y);
                    const currentSpeed = driveInput * 18.0;
                    const nextPos = model.position.clone().addScaledVector(forwardVector, currentSpeed * delta);

                    if (!checkCollision(nextPos, 1.6)) {
                        model.position.copy(nextPos);
                    }

                    // Spin wheels
                    if (wheels && wheels.length > 0) {
                        wheels.forEach(w => w.rotation.x += currentSpeed * delta * 1.5);
                    }

                    // Suspension pitch tilt
                    const pitchTarget = -driveInput * 0.08;
                    model.rotation.x = THREE.MathUtils.lerp(model.rotation.x, pitchTarget, 0.1);

                } else if (type === 'character') {
                    // REALISTIC HUMAN SKELETAL & PHYSICS MOVEMENT
                    const inputMag = Math.hypot(joystick.x, joystick.y);
                    const speedMultiplier = actionState.sprint ? 2.2 : 1.0;
                    const moveSpeed = inputMag * 6.5 * speedMultiplier;

                    if (inputMag > 0.15) {
                        const targetAngle = Math.atan2(joystick.x, joystick.y);
                        model.rotation.y = THREE.MathUtils.lerp(model.rotation.y, targetAngle, 0.2);

                        const forwardVector = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y);
                        const nextPos = model.position.clone().addScaledVector(forwardVector, moveSpeed * delta);

                        if (!checkCollision(nextPos, 0.7)) {
                            model.position.x = nextPos.x;
                            model.position.z = nextPos.z;
                        }

                        audio.playFootstep();

                        if (actions.walk && controlledEntity.currentAction !== 'walk') {
                            if (actions.idle) actions.idle.fadeOut(0.2);
                            actions.walk.reset().fadeIn(0.2).play();
                            controlledEntity.currentAction = 'walk';
                        }
                    } else {
                        if (actions.idle && controlledEntity.currentAction !== 'idle') {
                            if (actions.walk) actions.walk.fadeOut(0.25);
                            actions.idle.reset().fadeIn(0.25).play();
                            controlledEntity.currentAction = 'idle';
                        }
                    }

                    // Gravity & Jumping physics
                    velocity.y -= 28.0 * delta; // Gravity
                    model.position.y += velocity.y * delta;

                    if (model.position.y <= controlledEntity.baseY) {
                        model.position.y = controlledEntity.baseY;
                        velocity.y = 0;
                        controlledEntity.isGrounded = true;
                    }
                }

                // 7. CINEMATIC CHASE CAMERA (Strictly behind the player like GTA/God of War)
                controls.enabled = false;
                const targetPos = model.position;
                const isCar = type === 'vehicle';
                const camDistance = isCar ? 9.5 : 5.8;
                const camHeight = isCar ? 3.8 : 2.7;

                const camOffset = new THREE.Vector3(0, camHeight, -camDistance);
                camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y + Math.PI);

                const desiredCamPos = targetPos.clone().add(camOffset);
                camera.position.lerp(desiredCamPos, 0.12);

                const lookTarget = targetPos.clone().add(new THREE.Vector3(0, isCar ? 1.3 : 1.6, 0));
                camera.lookAt(lookTarget);

            } else {
                controls.enabled = true;
            }

            // Keep infinite floor following camera
            if (infiniteFloor && infiniteGrid) {
                infiniteFloor.position.x = camera.position.x;
                infiniteFloor.position.z = camera.position.z;
                infiniteGrid.position.x = Math.floor(camera.position.x / 10) * 10;
                infiniteGrid.position.z = Math.floor(camera.position.z / 10) * 10;
            }

            for (let mixer of activeMixers) mixer.update(delta);
            if (controls.enabled) controls.update();
            renderer.render(scene, camera);
        }

        // 8. SMART SCENE MANIPULATION OR SEARCH DISPATCHER
        async function handleAIPrompt(userQuery) {
            const geminiKey = localStorage.getItem('apexgen_gemini_key');
            const sketchfabToken = localStorage.getItem('apexgen_sketchfab_token');
            const status = document.getElementById('status-indicator');

            // Check if user wants to move, delete, or modify an existing model
            const lower = userQuery.toLowerCase();
            if (lower.includes('move') || lower.includes('ببە') || lower.includes('بگۆڕە') || lower.includes('لاببە') || lower.includes('scale')) {
                if (loadedModels.length > 0 && geminiKey) {
                    status.innerText = "Directing scene with AI...";
                    await executeSceneModification(userQuery, geminiKey);
                    return;
                }
            }

            // Otherwise, search & open selection picker
            await searchAndOpenPicker(userQuery);
        }

        // AI Scene Modifier
        async function executeSceneModification(command, apiKey) {
            const status = document.getElementById('status-indicator');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an AI scene director for Three.js.
Existing models are in array 'loadedModels'. Last active model is 'loadedModels[loadedModels.length - 1]'.
User command: "${command}"
Generate ONLY JavaScript to modify position, scale, or rotation of the model. Example: loadedModels[loadedModels.length - 1].position.x += 10;
Output code inside \`\`\`javascript ... \`\`\`.`
                            }]
                        }]
                    })
                });
                const data = await res.json();
                const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const match = text.match(/```(?:javascript|js)?([\s\S]*?)```/);
                const code = match ? match[1].trim() : text;
                new Function('loadedModels', 'scene', 'THREE', code)(loadedModels, scene, THREE);
                status.innerText = "✨ Model adjusted successfully!";
            } catch(e) {
                status.innerText = "Modification error: " + e.message;
            }
        }

        // 9. SEARCH SKETCHFAB & DISPLAY SCROLLABLE PICKER
        async function searchAndOpenPicker(userQuery) {
            const sketchfabToken = localStorage.getItem('apexgen_sketchfab_token');
            const geminiKey = localStorage.getItem('apexgen_gemini_key');

            if (!sketchfabToken) {
                document.getElementById('api-modal').classList.remove('hidden');
                return;
            }

            const status = document.getElementById('status-indicator');
            status.innerText = `🔍 Searching Sketchfab for "${userQuery}"...`;

            let englishKeyword = userQuery;
            if (geminiKey) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Extract ONLY 1 to 3 clean, specific English 3D search keywords for Sketchfab from this prompt: "${userQuery}". Output ONLY the keywords:`
                                }]
                            }]
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        englishKeyword = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim().replace(/["\n\r]/g, '') || userQuery;
                    }
                } catch(e) {}
            }

            const searchUrl = `https://api.sketchfab.com/v3/search?type=models&downloadable=true&q=${encodeURIComponent(englishKeyword)}&sort_by=-likeCount`;
            const searchRes = await fetch(searchUrl, { headers: { 'Authorization': `Token ${sketchfabToken}` } });

            if (!searchRes.ok) throw new Error("Sketchfab API token error.");
            const searchData = await searchRes.json();
            if (!searchData.results || searchData.results.length === 0) {
                throw new Error(`No 3D models found for "${englishKeyword}". Try another keyword.`);
            }

            const pickerGrid = document.getElementById('picker-grid');
            pickerGrid.innerHTML = '';

            searchData.results.slice(0, 12).forEach((item) => {
                const thumbUrl = item.thumbnails?.images?.[0]?.url || 'https://via.placeholder.com/150';
                const card = document.createElement('div');
                card.className = 'model-item';
                card.innerHTML = `
                    <img src="${thumbUrl}" class="model-thumb" alt="${item.name}" />
                    <div class="model-info">
                        <div class="model-name">${item.name}</div>
                        <div class="model-author">by ${item.user.username}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    document.getElementById('picker-modal').classList.add('hidden');
                    downloadAndBuildModel(item, sketchfabToken, englishKeyword);
                });

                pickerGrid.appendChild(card);
            });

            document.getElementById('picker-modal').classList.remove('hidden');
            status.innerText = `Select your preferred style from the popup window!`;
        }

        // 10. DOWNLOAD, UNPACK & BUILD
        async function downloadAndBuildModel(item, token, queryKeyword) {
            const status = document.getElementById('status-indicator');
            status.innerText = `⏳ Requesting download for "${item.name}"...`;

            const downloadRes = await fetch(`https://api.sketchfab.com/v3/models/${item.uid}/download`, {
                headers: { 'Authorization': `Token ${token}` }
            });

            if (!downloadRes.ok) throw new Error("Download permission denied.");
            const downloadData = await downloadRes.json();
            const gltfInfo = downloadData.gltf;
            if (!gltfInfo || !gltfInfo.url) throw new Error("glTF format unavailable for this model.");

            status.innerText = `📥 Downloading ${(gltfInfo.size / (1024*1024)).toFixed(1)} MB...`;
            const fileRes = await fetch(gltfInfo.url);
            const arrayBuffer = await fileRes.arrayBuffer();

            status.innerText = `⚙️ Preparing textures & colliders...`;
            const zip = await JSZip.loadAsync(arrayBuffer);
            const fileMap = {};

            for (let path in zip.files) {
                const file = zip.files[path];
                if (!file.dir) {
                    const blob = await file.async("blob");
                    const blobUrl = URL.createObjectURL(blob);
                    fileMap[path] = blobUrl;
                    const cleanName = path.split('/').pop();
                    fileMap[cleanName] = blobUrl;
                }
            }

            const glbPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.glb'));
            const customLoader = new THREE.GLTFLoader();

            if (glbPath) {
                const buffer = await zip.files[glbPath].async("arraybuffer");
                customLoader.parse(buffer, '', (gltf) => {
                    handleEntitySetup(gltf, item, queryKeyword);
                });
                return;
            }

            const gltfPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.gltf'));
            if (!gltfPath) throw new Error("Corrupted model archive.");

            const gltfText = await zip.files[gltfPath].async("string");
            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const clean = url.split('/').pop().split('?')[0];
                return fileMap[clean] || fileMap[url] || url;
            });

            new THREE.GLTFLoader(manager).parse(gltfText, '', (gltf) => {
                handleEntitySetup(gltf, item, queryKeyword);
            });
        }

        // 11. REALISTIC ENTITY SCALING & SOUND/PHYSICS SETUP
        function handleEntitySetup(gltf, item, query) {
            const status = document.getElementById('status-indicator');
            const model = gltf.scene;

            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;

            const lower = (query + " " + item.name).toLowerCase();
            let desiredSize = 4.8;
            let entityType = 'static';

            if (lower.match(/village|town|city|castle|terrain|island|map|park|building|house|cabin/)) {
                desiredSize = 75.0; // Large world environment
                entityType = 'static';
            } else if (lower.match(/car|truck|ferrari|toyota|bmw|vehicle|police|tank|motorcycle|bike/)) {
                desiredSize = 4.8;  // Real vehicle size
                entityType = 'vehicle';
            } else if (lower.match(/kratos|batman|character|girl|boy|man|soldier|npc|warrior|robot|human|roxy/)) {
                desiredSize = 1.95; // Human height
                entityType = 'character';
            }

            const targetScale = desiredSize / maxDim;
            model.scale.set(targetScale, targetScale, targetScale);

            box.setFromObject(model);
            const baseY = -box.min.y;
            model.position.y = baseY;

            if (loadedModels.length > 0 && entityType !== 'static') {
                model.position.x += loadedModels.length * 7;
            }

            // Register obstacle collider if static to prevent passing through
            if (entityType === 'static') {
                staticColliders.push({
                    position: model.position,
                    radius: desiredSize * 0.45
                });
            }

            // Find car wheels for physics spin
            const wheels = [];
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.name.toLowerCase().match(/wheel|tire|rim/)) {
                        wheels.push(child);
                    }
                }
            });

            // Parse animations
            const actions = {};
            if (gltf.animations && gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    const action = mixer.clipAction(clip);
                    const name = clip.name.toLowerCase();
                    if (name.includes('walk') || name.includes('run')) actions.walk = action;
                    else if (name.includes('attack') || name.includes('slash') || name.includes('punch')) actions.attack = action;
                    else if (name.includes('idle') || name.includes('stand')) actions.idle = action;
                    else if (!actions.idle) actions.idle = action;
                });

                if (actions.idle) actions.idle.play();
                activeMixers.push(mixer);
            }

            scene.add(model);
            loadedModels.push(model);

            const joystickZone = document.getElementById('joystick-zone');
            const actionZone = document.getElementById('action-buttons-zone');
            const exitBtn = document.getElementById('exit-control-btn');

            if (entityType === 'vehicle' || entityType === 'character') {
                controlledEntity = {
                    model,
                    type: entityType,
                    wheels,
                    actions,
                    currentAction: 'idle',
                    velocity: new THREE.Vector3(0, 0, 0),
                    baseY,
                    isGrounded: true
                };

                joystickZone.classList.remove('hidden');
                exitBtn.classList.remove('hidden');

                if (entityType === 'character') {
                    actionZone.classList.remove('hidden');
                } else {
                    actionZone.classList.add('hidden');
                    audio.startEngine(); // Start realistic engine sound
                }

                status.innerText = `✨ Controlling "${item.name}". Chase Cam & Physics active!`;
            } else {
                controlledEntity = null;
                joystickZone.classList.add('hidden');
                actionZone.classList.add('hidden');
                exitBtn.classList.add('hidden');
                audio.stopEngine();
                status.innerText = `✨ Built "${item.name}" on the infinite map.`;
            }
        }

        // 12. EXIT CONTROL HANDLER
        function exitControl() {
            controlledEntity = null;
            document.getElementById('joystick-zone').classList.add('hidden');
            document.getElementById('action-buttons-zone').classList.add('hidden');
            document.getElementById('exit-control-btn').classList.add('hidden');
            audio.stopEngine();
            controls.enabled = true;
            document.getElementById('status-indicator').innerText = "Exited control mode. Free Orbit Cam active.";
        }

        window.addEventListener('DOMContentLoaded', () => {
            initBootIntro();
            initScene();

            if (!localStorage.getItem('apexgen_sketchfab_token')) {
                document.getElementById('api-modal').classList.remove('hidden');
            }

            document.getElementById('exit-control-btn').addEventListener('click', exitControl);

            document.getElementById('key-btn').addEventListener('click', () => {
                document.getElementById('sketchfab-token-input').value = localStorage.getItem('apexgen_sketchfab_token') || '';
                document.getElementById('gemini-key-input').value = localStorage.getItem('apexgen_gemini_key') || '';
                document.getElementById('api-modal').classList.remove('hidden');
            });

            document.getElementById('btn-close-key').addEventListener('click', () => {
                document.getElementById('api-modal').classList.add('hidden');
            });

            document.getElementById('btn-save-key').addEventListener('click', () => {
                const sk = document.getElementById('sketchfab-token-input').value.trim();
                const gm = document.getElementById('gemini-key-input').value.trim();
                if (sk) localStorage.setItem('apexgen_sketchfab_token', sk);
                if (gm) localStorage.setItem('apexgen_gemini_key', gm);
                document.getElementById('api-modal').classList.add('hidden');
                document.getElementById('status-indicator').innerText = "Settings saved!";
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                loadedModels.forEach(m => scene.remove(m));
                loadedModels = [];
                staticColliders = [];
                activeMixers = [];
                exitControl();
                document.getElementById('status-indicator').innerText = "Universe cleared.";
            });

            document.getElementById('picker-close-btn').addEventListener('click', () => {
                document.getElementById('picker-modal').classList.add('hidden');
            });

            const aiInput = document.getElementById('ai-input');
            const aiSend = document.getElementById('ai-send');
            const handleExecute = async () => {
                const prompt = aiInput.value.trim();
                if (prompt) {
                    try {
                        await handleAIPrompt(prompt);
                    } catch (err) {
                        document.getElementById('status-indicator').innerText = "Error: " + err.message;
                    }
                }
            };
            aiSend.addEventListener('click', handleExecute);
            aiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleExecute(); });
        });
    </script>
