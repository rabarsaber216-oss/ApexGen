<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexGen - AI Studio Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #02040a; color: #ffffff; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* HEADER HUD */
        header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 20;
            background: linear-gradient(to bottom, rgba(2,4,10,0.9), transparent); pointer-events: none;
        }
        .brand { font-size: 1.3rem; font-weight: 900; color: #38bdf8; letter-spacing: 1.5px; pointer-events: auto; }
        .header-actions { display: flex; gap: 8px; pointer-events: auto; }
        .hud-btn {
            background: rgba(15, 23, 42, 0.85); color: #f8fafc; border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .btn-danger { background: rgba(225, 29, 72, 0.85); border-color: #fb7185; }

        /* ANALOG JOYSTICK */
        #joystick-zone {
            position: absolute; bottom: 85px; left: 20px; width: 130px; height: 130px; z-index: 50; touch-action: none;
        }
        .joystick-base {
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(30,41,59,0.85) 0%, rgba(15,23,42,0.95) 100%);
            border: 2px solid rgba(56, 189, 248, 0.4); border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .joystick-thumb {
            width: 55px; height: 55px; background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.6); position: absolute; pointer-events: none;
        }

        /* ACTION BUTTONS */
        #action-buttons-zone {
            position: absolute; bottom: 85px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 12px; align-items: center;
        }
        .action-btn {
            width: 55px; height: 55px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(56, 189, 248, 0.5); color: white; font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            cursor: pointer; backdrop-filter: blur(8px); touch-action: none;
        }
        .action-btn:active { transform: scale(0.9); background: #0284c7; }

        /* COMMAND BAR */
        .chat-container {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 650px; z-index: 20; display: flex; flex-direction: column; gap: 6px;
        }
        .chat-status {
            font-size: 0.78rem; color: #38bdf8; background: rgba(15, 23, 42, 0.9);
            padding: 5px 12px; border-radius: 6px; backdrop-filter: blur(8px); border-left: 3px solid #38bdf8; align-self: flex-start;
        }
        .chat-bar {
            display: flex; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px; padding: 5px 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.8); align-items: center; gap: 6px; backdrop-filter: blur(10px);
        }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 0.9rem; padding: 6px; }

        /* API SETTINGS MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-card {
            background: #0b1120; border: 1px solid #1e293b; padding: 22px; border-radius: 16px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-card input {
            width: 100%; background: #1e293b; border: 1px solid #334155; color: white;
            padding: 9px 12px; border-radius: 8px; margin-top: 5px; margin-bottom: 14px; outline: none; font-size: 0.85rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="brand">ApexGen</div>
        <div class="header-actions">
            <button id="key-btn" class="hud-btn" style="border-color: #38bdf8; color: #38bdf8;">Key ⚙️</button>
            <button id="undo-btn" class="hud-btn">Undo ↩️</button>
            <button id="clear-btn" class="hud-btn btn-danger">Clear 🗑️</button>
            <button id="exit-control-btn" class="hud-btn btn-danger hidden">Exit ✕</button>
        </div>
    </header>

    <div id="webgl-canvas"></div>

    <div id="joystick-zone" class="hidden">
        <div class="joystick-base" id="joystick-base">
            <div class="joystick-thumb" id="joystick-thumb"></div>
        </div>
    </div>

    <div id="action-buttons-zone" class="hidden">
        <button id="btn-attack" class="action-btn" style="border-color: #f43f5e;">⚔️</button>
        <button id="btn-jump" class="action-btn">🦘</button>
    </div>

    <!-- API SETTINGS MODAL -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="color:#38bdf8; margin-bottom: 12px;">AI & API Keys Setup</h3>
            <div style="text-align: left; font-size: 0.8rem; color: #94a3b8;">
                <label>Gemini / OpenAI / Claude API Key</label>
                <input type="text" id="api-key-input" placeholder="Paste your API key here..." />
            </div>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button id="btn-save-key" class="hud-btn" style="background: #0284c7; border: none; padding: 8px 20px;">Save</button>
                <button id="btn-close-key" class="hud-btn">Close</button>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div id="status-indicator" class="chat-status">Ready. Click 'Key ⚙️' to add your API key, then build!</div>
        <div class="chat-bar">
            <input type="text" id="ai-input" class="chat-input" placeholder="Type command..." />
            <button id="ai-send" class="hud-btn" style="background: #0284c7; border: none; padding: 8px 18px;">Build</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let loadedModels = [];
        let staticColliders = [];
        let controlledEntity = null;
        let clock = new THREE.Clock();
        let infiniteFloor, infiniteGrid;

        const joystick = { x: 0, y: 0, active: false };

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x02040a);
            scene.fog = new THREE.FogExp2(0x02040a, 0.003);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 8, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const groundGeo = new THREE.PlaneGeometry(15000, 15000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x050b18, roughness: 0.9 });
            infiniteFloor = new THREE.Mesh(groundGeo, groundMat);
            infiniteFloor.rotation.x = -Math.PI / 2;
            infiniteFloor.receiveShadow = true;
            scene.add(infiniteFloor);

            infiniteGrid = new THREE.GridHelper(4000, 400, 0x38bdf8, 0x1e293b);
            infiniteGrid.position.y = 0.02;
            scene.add(infiniteGrid);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
            dirLight.position.set(40, 60, 30);
            dirLight.castShadow = true;
            scene.add(dirLight);

            setupJoystick();
            setupButtons();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const thumb = document.getElementById('joystick-thumb');
            const maxRadius = 38;
            let touchId = null, center = { x: 0, y: 0 };

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                touchId = t.identifier;
                const rect = base.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                joystick.active = true;
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!joystick.active) return;
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        let dx = t.clientX - center.x, dy = t.clientY - center.y;
                        let dist = Math.hypot(dx, dy);
                        if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
                        thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                        joystick.x = dx / maxRadius; joystick.y = -dy / maxRadius;
                    }
                }
            }, { passive: false });

            const end = () => {
                touchId = null; joystick.active = false; joystick.x = 0; joystick.y = 0;
                thumb.style.transform = `translate(0px, 0px)`;
            };
            window.addEventListener('touchend', end);
        }

        function setupButtons() {
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (controlledEntity && controlledEntity.isGrounded) {
                    controlledEntity.velocity.y = 12;
                    controlledEntity.isGrounded = false;
                }
            });
        }

        function spawnEntity(query) {
            const q = query.toLowerCase();
            const group = new THREE.Group();
            let type = 'character';

            if (q.includes('car') || q.includes('سەیارە')) {
                type = 'vehicle';
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 4.6), new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.8 }));
                body.position.y = 0.6; body.castShadow = true; group.add(body);
            } else if (q.includes('castle') || q.includes('خانوو')) {
                type = 'static';
                const base = new THREE.Mesh(new THREE.BoxGeometry(9, 6, 9), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                base.position.y = 3; base.castShadow = true; group.add(base);
                staticColliders.push({ position: group.position, radius: 5 });
            } else {
                type = 'character';
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.5), new THREE.MeshStandardMaterial({ color: 0xf43f5e }));
                body.position.y = 1.3; body.castShadow = true; group.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfde047 }));
                head.position.y = 2.1; group.add(head);
            }

            if (loadedModels.length > 0 && type !== 'static') group.position.x += loadedModels.length * 6;
            scene.add(group);

            const record = { model: group, type, velocity: new THREE.Vector3(), baseY: 0, isGrounded: true };
            loadedModels.push(record);

            if (type !== 'static') {
                controlledEntity = record;
                document.getElementById('joystick-zone').classList.remove('hidden');
                document.getElementById('exit-control-btn').classList.remove('hidden');
                if (type === 'character') document.getElementById('action-buttons-zone').classList.remove('hidden');
            }
            document.getElementById('status-indicator').innerText = `✨ Successfully built: "${query}"!`;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (controlledEntity && controlledEntity.model) {
                const { model, type, velocity } = controlledEntity;

                if (type === 'vehicle') {
                    if (Math.abs(joystick.y) > 0.05) {
                        model.rotation.y -= joystick.x * 3.0 * delta * Math.sign(joystick.y);
                        const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y);
                        model.position.addScaledVector(fwd, joystick.y * 18 * delta);
                    }
                } else if (type === 'character') {
                    const mag = Math.hypot(joystick.x, joystick.y);
                    if (mag > 0.15) {
                        model.rotation.y = Math.atan2(joystick.x, joystick.y);
                        const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y);
                        model.position.addScaledVector(fwd, mag * 7 * delta);
                    }
                    velocity.y -= 25 * delta;
                    model.position.y += velocity.y * delta;
                    if (model.position.y <= 0) { model.position.y = 0; velocity.y = 0; controlledEntity.isGrounded = true; }
                }

                // Chase Camera
                controls.enabled = false;
                const offset = new THREE.Vector3(0, type === 'vehicle' ? 4 : 2.8, type === 'vehicle' ? -10 : -6);
                offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), model.rotation.y + Math.PI);
                camera.position.lerp(model.position.clone().add(offset), 0.12);
                camera.lookAt(model.position.clone().add(new THREE.Vector3(0, 1.4, 0)));
            } else {
                controls.enabled = true;
            }

            if (infiniteFloor && infiniteGrid) {
                infiniteFloor.position.x = camera.position.x; infiniteFloor.position.z = camera.position.z;
                infiniteGrid.position.x = Math.floor(camera.position.x / 10) * 10;
                infiniteGrid.position.z = Math.floor(camera.position.z / 10) * 10;
            }

            if (controls.enabled) controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScene();

            // Key Modal Logic
            const modal = document.getElementById('api-modal');
            if (!localStorage.getItem('apexgen_api_key')) {
                modal.classList.remove('hidden');
            }

            document.getElementById('key-btn').addEventListener('click', () => {
                document.getElementById('api-key-input').value = localStorage.getItem('apexgen_api_key') || '';
                modal.classList.remove('hidden');
            });

            document.getElementById('btn-close-key').addEventListener('click', () => modal.classList.add('hidden'));

            document.getElementById('btn-save-key').addEventListener('click', () => {
                const key = document.getElementById('api-key-input').value.trim();
                if (key) {
                    localStorage.setItem('apexgen_api_key', key);
                    document.getElementById('status-indicator').innerText = "API Key saved successfully!";
                }
                modal.classList.add('hidden');
            });

            document.getElementById('undo-btn').addEventListener('click', () => {
                if (loadedModels.length === 0) return;
                const last = loadedModels.pop();
                scene.remove(last.model);
                document.getElementById('status-indicator').innerText = "↩️ Last item undone.";
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                loadedModels.forEach(m => scene.remove(m.model));
                loadedModels = [];
                controlledEntity = null;
                document.getElementById('joystick-zone').classList.add('hidden');
                document.getElementById('action-buttons-zone').classList.add('hidden');
                document.getElementById('exit-control-btn').classList.add('hidden');
                controls.enabled = true;
                document.getElementById('status-indicator').innerText = "🗑️ Studio cleared.";
            });

            document.getElementById('exit-control-btn').addEventListener('click', () => {
                controlledEntity = null;
                document.getElementById('joystick-zone').classList.add('hidden');
                document.getElementById('action-buttons-zone').classList.add('hidden');
                document.getElementById('exit-control-btn').classList.add('hidden');
                controls.enabled = true;
                document.getElementById('status-indicator').innerText = "Camera unlocked.";
            });

            const input = document.getElementById('ai-input');
            const execute = () => {
                const prompt = input.value.trim();
                if (prompt) {
                    spawnEntity(prompt);
                    input.value = '';
                }
            };
            document.getElementById('ai-send').addEventListener('click', execute);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') execute(); });
        });
    </script>
</body>
</html>
