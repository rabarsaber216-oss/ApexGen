<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexGen - Infinite 3D Universe</title>
    <!-- Three.js, Controls, Loaders & JSZip for Auto-Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            color: #ffffff;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* Top Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
            background: linear-gradient(to bottom, rgba(5, 8, 17, 0.95), transparent);
            pointer-events: none;
        }
        .brand {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            pointer-events: auto;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            pointer-events: auto;
            align-items: center;
        }
        .btn {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .btn-primary {
            background: #0284c7;
            border-color: #38bdf8;
        }
        .btn-code {
            border-color: #a855f7;
            color: #d8b4fe;
        }
        .hidden {
            display: none !important;
        }

        /* Live Code & Downloader Panel */
        #code-viewer-panel {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 90%;
            max-width: 380px;
            height: 280px;
            background: rgba(9, 14, 28, 0.96);
            border: 1px solid #8b5cf6;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(14px);
            z-index: 25;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid #334155;
            font-size: 0.78rem;
            font-weight: 700;
            color: #c7d2fe;
        }
        .viewer-controls {
            display: flex;
            gap: 6px;
        }
        .viewer-btn {
            background: #334155;
            border: none;
            color: #f8fafc;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        #code-content {
            padding: 10px;
            margin: 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            background: #030712;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }

        /* Bottom AI Chat Bar */
        .chat-container {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 650px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-status {
            font-size: 0.78rem;
            color: #94a3b8;
            background: rgba(10, 15, 29, 0.92);
            padding: 6px 14px;
            border-radius: 6px;
            align-self: flex-start;
            backdrop-filter: blur(8px);
            max-width: 100%;
            word-break: break-word;
            border-left: 3px solid #38bdf8;
        }
        .chat-bar {
            display: flex;
            background: rgba(10, 15, 29, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 6px 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.92rem;
            padding: 8px 12px;
        }
        .chat-input::placeholder {
            color: #64748b;
        }
        .btn-send {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: #0b1120;
            border: 1px solid #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7);
        }
        .modal-title {
            font-size: 1.25rem;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .modal-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">ApexGen</div>
        <div class="header-actions">
            <button id="toggle-code-btn" class="btn btn-code">Code &lt;/&gt;</button>
            <button id="key-btn" class="btn">Key ⚙️</button>
            <button id="clear-btn" class="btn">Clear</button>
        </div>
    </header>

    <div id="webgl-canvas"></div>

    <!-- Live Status & Code Inspector -->
    <div id="code-viewer-panel">
        <div class="viewer-header">
            <span>⚡ Sketchfab Downloader & Scene Code</span>
            <div class="viewer-controls">
                <button id="copy-code-btn" class="viewer-btn">Copy</button>
                <button id="close-viewer-btn" class="viewer-btn">✕</button>
            </div>
        </div>
        <pre id="code-content">// Infinite Map ready. Type ANY prompt to download from Sketchfab & build...</pre>
    </div>

    <!-- AI Chat Box -->
    <div class="chat-container">
        <div id="status-indicator" class="chat-status">Infinite Universe Ready. Type anything to search, download & build!</div>
        <div class="chat-bar">
            <input type="text" id="ai-input" class="chat-input" placeholder="Type literally anything: Toyota, Kratos, Batman, Ferrari..." />
            <button id="ai-send" class="btn-send">Generate</button>
        </div>
    </div>

    <!-- API Keys Modal -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 class="modal-title">API Key Settings</h2>
            <p class="modal-desc">Enter Sketchfab API Token to auto-download 3D models.</p>
            
            <div class="input-group">
                <label>Sketchfab API Token</label>
                <input type="text" id="sketchfab-token-input" placeholder="Paste Sketchfab token here..." />
            </div>

            <div class="input-group">
                <label>Gemini API Key (Optional AI Fallback)</label>
                <input type="text" id="gemini-key-input" placeholder="Paste Gemini key here..." />
            </div>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="btn-save-key" class="btn btn-primary">Save Settings</button>
                <button id="btn-close-key" class="btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let activeMixers = [];
        let currentModels = [];
        let infiniteFloor, infiniteGrid;
        let clock = new THREE.Clock();

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);

            // Deep Atmospheric Infinite Horizon Fog
            scene.fog = new THREE.FogExp2(0x060913, 0.0035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 8, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 800;
            controls.maxPolarAngle = Math.PI / 2 + 0.01;

            setupInfiniteMap();
            setupLighting();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // TRUE INFINITE MAP
        function setupInfiniteMap() {
            const groundGeo = new THREE.PlaneGeometry(12000, 12000);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x080d1a,
                roughness: 0.8,
                metalness: 0.2
            });
            infiniteFloor = new THREE.Mesh(groundGeo, groundMat);
            infiniteFloor.rotation.x = -Math.PI / 2;
            infiniteFloor.position.y = 0;
            infiniteFloor.receiveShadow = true;
            scene.add(infiniteFloor);

            infiniteGrid = new THREE.GridHelper(3000, 300, 0x38bdf8, 0x1e293b);
            infiniteGrid.position.y = 0.02;
            scene.add(infiniteGrid);
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111827, 0.9);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfff5ea, 2.0);
            sunLight.position.set(25, 40, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 250;
            sunLight.shadow.camera.left = -35;
            sunLight.shadow.camera.right = 35;
            sunLight.shadow.camera.top = 35;
            sunLight.shadow.camera.bottom = -35;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            rimLight.position.set(-20, 15, -20);
            scene.add(rimLight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (infiniteFloor && infiniteGrid) {
                infiniteFloor.position.x = camera.position.x;
                infiniteFloor.position.z = camera.position.z;
                infiniteGrid.position.x = Math.floor(camera.position.x / 10) * 10;
                infiniteGrid.position.z = Math.floor(camera.position.z / 10) * 10;
            }

            for (let mixer of activeMixers) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // FIXED UNZIP & GLTF BUFFER LOADER
        async function fetchAndDownloadFromSketchfab(searchQuery, token) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            status.innerText = `🔍 Searching Sketchfab for: "${searchQuery}"...`;
            codeContent.innerText = `// Connecting to Sketchfab API...\n// Query: ${searchQuery}\n`;
            document.getElementById('code-viewer-panel').classList.remove('hidden');

            const searchUrl = `https://api.sketchfab.com/v3/search?type=models&downloadable=true&q=${encodeURIComponent(searchQuery)}&sort_by=-likeCount`;
            
            const searchRes = await fetch(searchUrl, {
                headers: { 'Authorization': `Token ${token}` }
            });

            if (!searchRes.ok) {
                throw new Error("Sketchfab API authentication failed. Check your API token.");
            }

            const searchData = await searchRes.json();
            if (!searchData.results || searchData.results.length === 0) {
                throw new Error(`No downloadable 3D model found on Sketchfab for: "${searchQuery}"`);
            }

            const bestModel = searchData.results[0];
            codeContent.innerText += `// Found Model: "${bestModel.name}" by ${bestModel.user.username}\n// Model UID: ${bestModel.uid}\n// Requesting download link...\n`;
            status.innerText = `⏳ Requesting download for "${bestModel.name}"...`;

            const downloadUrlEndpoint = `https://api.sketchfab.com/v3/models/${bestModel.uid}/download`;
            const downloadRes = await fetch(downloadUrlEndpoint, {
                headers: { 'Authorization': `Token ${token}` }
            });

            if (!downloadRes.ok) {
                throw new Error("Download request denied by Sketchfab.");
            }

            const downloadData = await downloadRes.json();
            const gltfInfo = downloadData.gltf;
            if (!gltfInfo || !gltfInfo.url) {
                throw new Error("Download link not available for this model.");
            }

            status.innerText = `📥 Downloading "${bestModel.name}" (${(gltfInfo.size / (1024*1024)).toFixed(1)} MB)...`;
            codeContent.innerText += `// Downloading archive (${(gltfInfo.size / (1024*1024)).toFixed(1)} MB)...\n`;

            const fileRes = await fetch(gltfInfo.url);
            const arrayBuffer = await fileRes.arrayBuffer();

            codeContent.innerText += `// Download complete! Unpacking buffers & textures...\n`;
            status.innerText = `⚙️ Preparing textures & buffers...`;

            const zip = await JSZip.loadAsync(arrayBuffer);
            const fileMap = {};

            // Unpack all files and map them by both relative path and direct filename
            for (let path in zip.files) {
                const file = zip.files[path];
                if (!file.dir) {
                    const blob = await file.async("blob");
                    const blobUrl = URL.createObjectURL(blob);
                    fileMap[path] = blobUrl;
                    
                    const simpleFilename = path.split('/').pop();
                    fileMap[simpleFilename] = blobUrl;
                }
            }

            // Check if there is a direct single .glb inside
            const glbPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.glb'));
            const customLoader = new THREE.GLTFLoader();

            if (glbPath) {
                const buffer = await zip.files[glbPath].async("arraybuffer");
                customLoader.parse(buffer, '', (gltf) => {
                    handleModelSuccess(gltf, bestModel);
                }, (err) => {
                    throw new Error("Error parsing GLB: " + err.message);
                });
                return;
            }

            // If it's a standard glTF (scene.gltf + scene.bin + textures)
            const gltfPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.gltf'));
            if (!gltfPath) {
                throw new Error("Corrupted archive: No .gltf or .glb found.");
            }

            const gltfText = await zip.files[gltfPath].async("string");

            // Setup bulletproof manager to resolve scene.bin and all textures directly from memory
            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const decoded = decodeURIComponent(url);
                const name1 = url.split('/').pop().split('?')[0];
                const name2 = decoded.split('/').pop().split('?')[0];

                if (fileMap[name1]) return fileMap[name1];
                if (fileMap[name2]) return fileMap[name2];
                if (fileMap[url]) return fileMap[url];
                if (fileMap[decoded]) return fileMap[decoded];

                for (let k in fileMap) {
                    if (k.endsWith(name1) || k.endsWith(name2) || decoded.endsWith(k)) {
                        return fileMap[k];
                    }
                }
                return url;
            });

            const robustLoader = new THREE.GLTFLoader(manager);
            robustLoader.parse(gltfText, '', (gltf) => {
                handleModelSuccess(gltf, bestModel);
            }, (err) => {
                status.innerText = "Error loading unpacked model: " + err.message;
            });
        }

        function handleModelSuccess(gltf, bestModel) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            const model = gltf.scene;

            // Auto-center and normalize scale for the infinite world
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetScale = 6.0 / (maxDim || 1);
            model.scale.set(targetScale, targetScale, targetScale);

            box.setFromObject(model);
            model.position.y = -box.min.y;

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(model);
            currentModels.push(model);

            if (gltf.animations && gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                activeMixers.push(mixer);
            }

            controls.target.set(0, 3, 0);
            camera.position.set(0, 7, 16);

            codeContent.innerText += `\n// ✨ MODEL SUCCESSFULLY BUILT ON INFINITE MAP!\n// Title: ${bestModel.name}\n// Animations: ${gltf.animations ? gltf.animations.length : 0} clips active.`;
            status.innerText = `✨ Successfully built: "${bestModel.name}"!`;
        }

        // Procedural AI Fallback
        async function buildProceduralAI(promptText, geminiKey) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            status.innerText = "Building 3D world with Gemini AI...";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "You are a Three.js expert. Output ONLY valid JS code inside ```javascript ... ``` to construct the user request on the infinite map. Set castShadow=true on meshes." },
                            { text: `Build: ${promptText}` }
                        ]
                    }]
                })
            });

            if (!res.ok) throw new Error("Gemini AI error. Check key.");
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const match = text.match(/```(?:javascript|js)?([\s\S]*?)```/);
            const codeToRun = match ? match[1].trim() : text;

            codeContent.innerText = codeToRun;
            document.getElementById('code-viewer-panel').classList.remove('hidden');
            new Function('scene', 'THREE', codeToRun)(scene, THREE);
            status.innerText = "✨ Built on Infinite Map!";
        }

        // Main Execution Entrypoint
        async function handleUserInput(promptText) {
            const sketchfabToken = localStorage.getItem('apexgen_sketchfab_token');
            const geminiKey = localStorage.getItem('apexgen_gemini_key');

            if (!sketchfabToken && !geminiKey) {
                document.getElementById('api-modal').classList.remove('hidden');
                return;
            }

            try {
                if (sketchfabToken) {
                    await fetchAndDownloadFromSketchfab(promptText, sketchfabToken);
                } else {
                    await buildProceduralAI(promptText, geminiKey);
                }
            } catch (err) {
                console.warn(err);
                document.getElementById('status-indicator').innerText = "Error: " + err.message;
                if (geminiKey && sketchfabToken) {
                    document.getElementById('status-indicator').innerText = "Sketchfab missed. Trying Gemini AI fallback...";
                    await buildProceduralAI(promptText, geminiKey);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScene();

            if (!localStorage.getItem('apexgen_sketchfab_token') && !localStorage.getItem('apexgen_gemini_key')) {
                document.getElementById('api-modal').classList.remove('hidden');
            }

            document.getElementById('key-btn').addEventListener('click', () => {
                document.getElementById('sketchfab-token-input').value = localStorage.getItem('apexgen_sketchfab_token') || '';
                document.getElementById('gemini-key-input').value = localStorage.getItem('apexgen_gemini_key') || '';
                document.getElementById('api-modal').classList.remove('hidden');
            });

            document.getElementById('btn-close-key').addEventListener('click', () => {
                document.getElementById('api-modal').classList.add('hidden');
            });

            document.getElementById('btn-save-key').addEventListener('click', () => {
                const skToken = document.getElementById('sketchfab-token-input').value.trim();
                const gmKey = document.getElementById('gemini-key-input').value.trim();
                if (skToken) localStorage.setItem('apexgen_sketchfab_token', skToken);
                if (gmKey) localStorage.setItem('apexgen_gemini_key', gmKey);
                document.getElementById('api-modal').classList.add('hidden');
                document.getElementById('status-indicator').innerText = "Keys saved! Type ANY prompt to download & build.";
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                currentModels.forEach(m => scene.remove(m));
                currentModels = [];
                activeMixers = [];
                document.getElementById('status-indicator').innerText = "Infinite universe cleared.";
            });

            document.getElementById('toggle-code-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.toggle('hidden');
            });
            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.add('hidden');
            });
            document.getElementById('copy-code-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(document.getElementById('code-content').innerText).then(() => alert("Copied!"));
            });

            const aiInput = document.getElementById('ai-input');
            const aiSend = document.getElementById('ai-send');
            const handleSend = () => {
                const prompt = aiInput.value.trim();
                if (prompt) {
                    handleUserInput(prompt);
                    aiInput.value = '';
                }
            };
            aiSend.addEventListener('click', handleSend);
            aiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
        });
    </script>
</body>
</html>
