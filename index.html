<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexGen - Controllable 3D Universe</title>
    <!-- Three.js, Controls & Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            color: #ffffff;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            touch-action: none;
        }

        /* Top Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(5, 8, 17, 0.95), transparent);
            pointer-events: none;
        }
        .brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            pointer-events: auto;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            pointer-events: auto;
            align-items: center;
        }
        .btn {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .btn-primary { background: #0284c7; border-color: #38bdf8; }
        .hidden { display: none !important; }

        /* Code Viewer */
        #code-viewer-panel {
            position: absolute;
            top: 60px;
            right: 12px;
            width: 90%;
            max-width: 360px;
            height: 240px;
            background: rgba(9, 14, 28, 0.96);
            border: 1px solid #8b5cf6;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
            z-index: 30;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(30, 41, 59, 0.9);
            font-size: 0.75rem;
            color: #c7d2fe;
            font-weight: bold;
        }
        #code-content {
            padding: 8px;
            font-family: monospace;
            font-size: 0.72rem;
            color: #38bdf8;
            background: #030712;
            overflow-y: auto;
            flex: 1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Mobile Virtual Touch Controls (D-Pad) */
        #mobile-controller {
            position: absolute;
            bottom: 80px;
            left: 20px;
            z-index: 25;
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(3, 48px);
            gap: 6px;
        }
        .ctrl-btn {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(2, 132, 199, 0.9);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Bottom Search & AI Bar */
        .chat-container {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 650px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-status {
            font-size: 0.76rem;
            color: #94a3b8;
            background: rgba(10, 15, 29, 0.92);
            padding: 5px 12px;
            border-radius: 6px;
            align-self: flex-start;
            backdrop-filter: blur(8px);
            border-left: 3px solid #38bdf8;
            max-width: 100%;
        }
        .chat-bar {
            display: flex;
            background: rgba(10, 15, 29, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 5px 8px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
            align-items: center;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.88rem;
            padding: 6px 8px;
        }
        .btn-img-upload {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-card {
            background: #0b1120;
            border: 1px solid #1e293b;
            padding: 22px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-card input {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">ApexGen</div>
        <div class="header-actions">
            <button id="toggle-code-btn" class="btn">Code &lt;/&gt;</button>
            <button id="key-btn" class="btn">Key ⚙️</button>
            <button id="clear-btn" class="btn">Clear</button>
        </div>
    </header>

    <div id="webgl-canvas"></div>

    <!-- On-screen D-Pad Controls for Driving / Moving -->
    <div id="mobile-controller">
        <button id="btn-up" class="ctrl-btn">⬆️</button>
        <button id="btn-left" class="ctrl-btn">⬅️</button>
        <button id="btn-down" class="ctrl-btn">⬇️</button>
        <button id="btn-right" class="ctrl-btn">➡️</button>
    </div>

    <!-- Code Viewer -->
    <div id="code-viewer-panel" class="hidden">
        <div class="viewer-header">
            <span>⚡ AI Downloader & Scene Code</span>
            <button id="close-viewer-btn" class="btn" style="padding: 2px 6px;">✕</button>
        </div>
        <pre id="code-content">// Search & Download logs will appear here...</pre>
    </div>

    <!-- AI Bar -->
    <div class="chat-container">
        <div id="status-indicator" class="chat-status">Ready. Describe in Kurdish/English or upload an image!</div>
        <div class="chat-bar">
            <!-- Hidden Image Input -->
            <input type="file" id="image-file-input" accept="image/*" style="display:none;" />
            <button id="btn-pick-image" class="btn-img-upload" title="Search with Image">📷</button>

            <input type="text" id="ai-input" class="chat-input" placeholder="e.g. گوندێکی بچووک, Ferrari, Kratos, Batman..." />
            <button id="ai-send" class="btn btn-primary">Build</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="api-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 style="color:#38bdf8; margin-bottom: 10px;">API Keys</h3>
            <div style="text-align: left; font-size: 0.8rem; color: #94a3b8;">
                <label>Sketchfab Token (from sketchfab.com/settings/password)</label>
                <input type="text" id="sketchfab-token-input" placeholder="Paste Token..." />
                <label>Gemini API Key (Required for Image Search & Kurdish Translation)</label>
                <input type="text" id="gemini-key-input" placeholder="Paste Gemini Key..." />
            </div>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button id="btn-save-key" class="btn btn-primary">Save</button>
                <button id="btn-close-key" class="btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let activeMixers = [];
        let loadedModels = [];
        let controlledModel = null;
        let clock = new THREE.Clock();
        let infiniteFloor, infiniteGrid;

        // Controller state
        const moveState = { forward: false, backward: false, left: false, right: false };

        function initScene() {
            const container = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);
            scene.fog = new THREE.FogExp2(0x060913, 0.0035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 10, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 1000;
            controls.maxPolarAngle = Math.PI / 2 + 0.01;

            setupInfiniteMap();
            setupLighting();
            setupTouchController();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function setupInfiniteMap() {
            const groundGeo = new THREE.PlaneGeometry(12000, 12000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x080d1a, roughness: 0.8, metalness: 0.2 });
            infiniteFloor = new THREE.Mesh(groundGeo, groundMat);
            infiniteFloor.rotation.x = -Math.PI / 2;
            infiniteFloor.receiveShadow = true;
            scene.add(infiniteFloor);

            infiniteGrid = new THREE.GridHelper(3000, 300, 0x38bdf8, 0x1e293b);
            infiniteGrid.position.y = 0.02;
            scene.add(infiniteGrid);
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x111827, 0.9);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfff5ea, 2.0);
            sunLight.position.set(30, 50, 25);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0001;
            scene.add(sunLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            rimLight.position.set(-20, 15, -20);
            scene.add(rimLight);
        }

        function setupTouchController() {
            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                const start = (e) => { e.preventDefault(); moveState[key] = true; };
                const end = (e) => { e.preventDefault(); moveState[key] = false; };
                el.addEventListener('touchstart', start);
                el.addEventListener('touchend', end);
                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
                el.addEventListener('mouseleave', end);
            };
            bindBtn('btn-up', 'forward');
            bindBtn('btn-down', 'backward');
            bindBtn('btn-left', 'left');
            bindBtn('btn-right', 'right');
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Handle driving / movement of the active model
            if (controlledModel) {
                const speed = 12 * delta;
                const rotSpeed = 2.5 * delta;

                if (moveState.left) controlledModel.rotation.y += rotSpeed;
                if (moveState.right) controlledModel.rotation.y -= rotSpeed;

                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), controlledModel.rotation.y);

                if (moveState.forward) controlledModel.position.addScaledVector(dir, speed);
                if (moveState.backward) controlledModel.position.addScaledVector(dir, -speed);

                // Camera follows controlled model smoothly
                controls.target.lerp(controlledModel.position, 0.08);
            }

            if (infiniteFloor && infiniteGrid) {
                infiniteFloor.position.x = camera.position.x;
                infiniteFloor.position.z = camera.position.z;
                infiniteGrid.position.x = Math.floor(camera.position.x / 10) * 10;
                infiniteGrid.position.z = Math.floor(camera.position.z / 10) * 10;
            }

            for (let mixer of activeMixers) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        // SMART TRANSLATOR & KEYWORD EXTRACTOR
        async function translateToEnglishSearch(query, geminiKey) {
            if (!geminiKey) return query;
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Extract ONLY 2 to 3 precise English 3D search keywords for Sketchfab from this user query (which might be in Kurdish or English). 
Do NOT include filler words like "make", "build", "download".
Examples:
"گوندێکی بچوک" -> "small medieval village"
"سەیارەیەکی وەرزشی" -> "sports car"
"ڕۆبۆت" -> "robot"
User query: "${query}"
Output ONLY the keywords:`
                            }]
                        }]
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    const cleanText = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                    if (cleanText) return cleanText.replace(/["\n\r]/g, '');
                }
            } catch(e) {}
            return query;
        }

        // IMAGE-TO-SKETCHFAB AI ANALYZER
        async function analyzeImageWithGemini(file, geminiKey) {
            const base64Data = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(geminiKey)}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Identify the main object in this picture and output ONLY 2-3 English search keywords to find its 3D model on Sketchfab (e.g. 'police car', 'wooden cabin', 'iron man'). Output nothing else:" },
                            { inline_data: { mime_type: file.type || "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            if (!res.ok) throw new Error("Could not analyze image with Gemini Vision.");
            const data = await res.json();
            return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim().replace(/["\n\r]/g, '') || "car";
        }

        // DOWLOAD AND SCALE INTELLIGENTLY
        async function fetchAndDownloadModel(searchQuery, token) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            status.innerText = `🔍 Searching Sketchfab for: "${searchQuery}"...`;
            codeContent.innerText = `// Keyword: "${searchQuery}"\n`;
            document.getElementById('code-viewer-panel').classList.remove('hidden');

            const searchUrl = `https://api.sketchfab.com/v3/search?type=models&downloadable=true&q=${encodeURIComponent(searchQuery)}&sort_by=-likeCount`;
            const searchRes = await fetch(searchUrl, { headers: { 'Authorization': `Token ${token}` } });
            if (!searchRes.ok) throw new Error("Sketchfab API Token invalid or expired.");

            const searchData = await searchRes.json();
            if (!searchData.results || searchData.results.length === 0) {
                throw new Error(`No 3D model found for "${searchQuery}".`);
            }

            const bestModel = searchData.results[0];
            codeContent.innerText += `// Match: "${bestModel.name}" by ${bestModel.user.username}\n// Requesting download URL...\n`;
            status.innerText = `⏳ Requesting download for "${bestModel.name}"...`;

            const downloadUrlEndpoint = `https://api.sketchfab.com/v3/models/${bestModel.uid}/download`;
            const downloadRes = await fetch(downloadUrlEndpoint, { headers: { 'Authorization': `Token ${token}` } });
            if (!downloadRes.ok) throw new Error("Sketchfab download permission denied.");

            const downloadData = await downloadRes.json();
            const gltfInfo = downloadData.gltf;
            if (!gltfInfo || !gltfInfo.url) throw new Error("glTF format unavailable for this model.");

            status.innerText = `📥 Downloading archive (${(gltfInfo.size / (1024*1024)).toFixed(1)} MB)...`;
            const fileRes = await fetch(gltfInfo.url);
            const arrayBuffer = await fileRes.arrayBuffer();

            status.innerText = `⚙️ Unpacking textures & buffers...`;
            const zip = await JSZip.loadAsync(arrayBuffer);
            const fileMap = {};

            for (let path in zip.files) {
                const file = zip.files[path];
                if (!file.dir) {
                    const blob = await file.async("blob");
                    const blobUrl = URL.createObjectURL(blob);
                    fileMap[path] = blobUrl;
                    const simpleFilename = path.split('/').pop();
                    fileMap[simpleFilename] = blobUrl;
                }
            }

            const glbPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.glb'));
            const customLoader = new THREE.GLTFLoader();

            if (glbPath) {
                const buffer = await zip.files[glbPath].async("arraybuffer");
                customLoader.parse(buffer, '', (gltf) => {
                    handleRealisticPlacement(gltf, bestModel, searchQuery);
                });
                return;
            }

            const gltfPath = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.gltf'));
            if (!gltfPath) throw new Error("No .gltf found in archive.");

            const gltfText = await zip.files[gltfPath].async("string");
            const manager = new THREE.LoadingManager();
            manager.setURLModifier((url) => {
                const clean = url.split('/').pop().split('?')[0];
                return fileMap[clean] || fileMap[url] || url;
            });

            const robustLoader = new THREE.GLTFLoader(manager);
            robustLoader.parse(gltfText, '', (gltf) => {
                handleRealisticPlacement(gltf, bestModel, searchQuery);
            });
        }

        // REALISTIC SCALING & POSITIONING LOGIC
        function handleRealisticPlacement(gltf, bestModel, query) {
            const status = document.getElementById('status-indicator');
            const codeContent = document.getElementById('code-content');
            const model = gltf.scene;

            // 1. Calculate raw dimensions
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;

            // 2. Intelligent Scaling based on category
            const lower = (query + " " + bestModel.name).toLowerCase();
            let desiredWorldSize = 4.5; // Default: Vehicle size

            if (lower.match(/village|town|city|castle|terrain|island|map|park|building|house/)) {
                desiredWorldSize = 65.0; // Huge environmental scale
            } else if (lower.match(/car|truck|ferrari|toyota|bmw|vehicle|police|tank|plane/)) {
                desiredWorldSize = 4.8;  // Real vehicle size (~4.8 meters)
            } else if (lower.match(/kratos|batman|roxy|character|girl|boy|man|soldier|npc|warrior|robot|human/)) {
                desiredWorldSize = 2.0;  // Real human height (~2 meters)
            } else if (lower.match(/sword|gun|helmet|apple|chair|box/)) {
                desiredWorldSize = 1.0;  // Small prop scale
            }

            const targetScale = desiredWorldSize / maxDim;
            model.scale.set(targetScale, targetScale, targetScale);

            // Re-calculate after scale to put exactly on ground
            box.setFromObject(model);
            model.position.y = -box.min.y;

            // Place next to existing models (so they don't stack on top of each other!)
            if (loadedModels.length > 0) {
                const offset = (loadedModels.length) * 8;
                model.position.x += offset;
            }

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(model);
            loadedModels.push(model);
            controlledModel = model; // Automatically set as active controllable object!

            if (gltf.animations && gltf.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
                activeMixers.push(mixer);
            }

            controls.target.copy(model.position);
            camera.position.set(model.position.x, model.position.y + 4, model.position.z + 10);

            codeContent.innerText += `\n// ✨ MODEL BUILT REALISTICALLY!\n// Name: ${bestModel.name}\n// Real Category Scale: ${desiredWorldSize}m\n// Use D-Pad buttons below to DRIVE / MOVE!`;
            status.innerText = `✨ Built: "${bestModel.name}". Use D-Pad (⬆️⬇️⬅️➡️) to control!`;
        }

        async function processPrompt(rawInput) {
            const sketchfabToken = localStorage.getItem('apexgen_sketchfab_token');
            const geminiKey = localStorage.getItem('apexgen_gemini_key');

            if (!sketchfabToken) {
                document.getElementById('api-modal').classList.remove('hidden');
                return;
            }

            document.getElementById('status-indicator').innerText = "Translating & analyzing query...";
            const englishSearch = await translateToEnglishSearch(rawInput, geminiKey);
            await fetchAndDownloadModel(englishSearch, sketchfabToken);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScene();

            if (!localStorage.getItem('apexgen_sketchfab_token')) {
                document.getElementById('api-modal').classList.remove('hidden');
            }

            document.getElementById('key-btn').addEventListener('click', () => {
                document.getElementById('sketchfab-token-input').value = localStorage.getItem('apexgen_sketchfab_token') || '';
                document.getElementById('gemini-key-input').value = localStorage.getItem('apexgen_gemini_key') || '';
                document.getElementById('api-modal').classList.remove('hidden');
            });

            document.getElementById('btn-close-key').addEventListener('click', () => {
                document.getElementById('api-modal').classList.add('hidden');
            });

            document.getElementById('btn-save-key').addEventListener('click', () => {
                const sk = document.getElementById('sketchfab-token-input').value.trim();
                const gm = document.getElementById('gemini-key-input').value.trim();
                if (sk) localStorage.setItem('apexgen_sketchfab_token', sk);
                if (gm) localStorage.setItem('apexgen_gemini_key', gm);
                document.getElementById('api-modal').classList.add('hidden');
                document.getElementById('status-indicator').innerText = "Settings saved!";
            });

            document.getElementById('clear-btn').addEventListener('click', () => {
                loadedModels.forEach(m => scene.remove(m));
                loadedModels = [];
                activeMixers = [];
                controlledModel = null;
                document.getElementById('status-indicator').innerText = "Universe cleared.";
            });

            document.getElementById('toggle-code-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.toggle('hidden');
            });
            document.getElementById('close-viewer-btn').addEventListener('click', () => {
                document.getElementById('code-viewer-panel').classList.add('hidden');
            });

            // Camera / Image Upload handler
            const fileInput = document.getElementById('image-file-input');
            document.getElementById('btn-pick-image').addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const geminiKey = localStorage.getItem('apexgen_gemini_key');
                const sketchfabToken = localStorage.getItem('apexgen_sketchfab_token');

                if (!geminiKey || !sketchfabToken) {
                    alert("Please set both Sketchfab Token and Gemini Key in Key ⚙️ first!");
                    document.getElementById('api-modal').classList.remove('hidden');
                    return;
                }

                document.getElementById('status-indicator').innerText = "📷 Analyzing image with AI...";
                try {
                    const detectedKeyword = await analyzeImageWithGemini(file, geminiKey);
                    document.getElementById('ai-input').value = detectedKeyword;
                    await fetchAndDownloadModel(detectedKeyword, sketchfabToken);
                } catch(err) {
                    document.getElementById('status-indicator').innerText = "Image error: " + err.message;
                }
            });

            // Text send
            const aiInput = document.getElementById('ai-input');
            const aiSend = document.getElementById('ai-send');
            const handleSend = () => {
                const prompt = aiInput.value.trim();
                if (prompt) {
                    processPrompt(prompt);
                    aiInput.value = '';
                }
            };
            aiSend.addEventListener('click', handleSend);
            aiInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
        });
    </script>
</body>
</html>
